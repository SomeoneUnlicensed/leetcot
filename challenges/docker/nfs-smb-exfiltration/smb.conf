[global]
workgroup = WORKGROUP
server string = warehouse-fs01
security = user
map to guest = Bad User
guest account = nobody
server min protocol = NT1
server smb encrypt = disabled
log level = 0
load printers = no
printing = bsd
printcap name = /dev/null
disable spoolss = yes

[backups]
path = /srv/samba/backups
browseable = yes
guest ok = yes
guest only = yes
read only = yes
force user = nobody
