name: Deploy Production on Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/db exec prisma generate

      - name: Run focused lint checks
        run: |
          pnpm --filter code-runner lint
          pnpm --filter @repo/monaco lint

      - name: Run fast type checks
        run: |
          pnpm --filter web typecheck
          pnpm --filter code-runner typecheck
          pnpm --filter @repo/code-runner typecheck
          pnpm --filter @repo/monaco typecheck

  build:
    needs: quality
    runs-on: ubuntu-latest

    env:
      IMAGE_REPOSITORY: ghcr.io/someoneunlicensed/leetcot
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, linux, cld4, production]

    env:
      IMAGE_REPOSITORY: ghcr.io/someoneunlicensed/leetcot
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      CODE_RUNNER_CONCURRENCY: "5"
      CODE_RUNNER_TIMEOUT_MS: "12000"
      CODE_RUNNER_GO_TIMEOUT_MS: "12000"
      CODE_RUNNER_MAX_QUEUE_DEPTH: "50"
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Pull image into k3s containerd
        run: |
          IMAGE="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "$IMAGE"
          docker save "$IMAGE" | sudo k3s ctr -n k8s.io images import --all-platforms -
          docker logout ghcr.io

      - name: Restart deployment (rolling update)
        run: |
          IMAGE="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          kubectl -n production set env deploy/leetcot-code-runner \
            CODE_RUNNER_CONCURRENCY="${CODE_RUNNER_CONCURRENCY}" \
            CODE_RUNNER_TIMEOUT_MS="${CODE_RUNNER_TIMEOUT_MS}" \
            CODE_RUNNER_GO_TIMEOUT_MS="${CODE_RUNNER_GO_TIMEOUT_MS}" \
            CODE_RUNNER_MAX_QUEUE_DEPTH="${CODE_RUNNER_MAX_QUEUE_DEPTH}"
          kubectl -n production set image deploy/leetcot-app app="$IMAGE"
          kubectl -n production set image deploy/leetcot-code-runner code-runner="$IMAGE"

          if ! kubectl -n production rollout status deploy/leetcot-app --timeout=300s; then
            kubectl -n production rollout undo deploy/leetcot-app
            exit 1
          fi

          if ! kubectl -n production rollout status deploy/leetcot-code-runner --timeout=300s; then
            kubectl -n production rollout undo deploy/leetcot-code-runner
            exit 1
          fi

      - name: Apply database migrations
        run: |
          POD=$(kubectl -n production get pod -l app=leetcot-app -o jsonpath='{.items[0].metadata.name}')
          kubectl -n production exec "$POD" -- pnpm --filter @repo/db exec prisma migrate deploy
