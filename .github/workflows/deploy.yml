name: Deploy Production on Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: [self-hosted, linux, cld4, production]

    env:
      IMAGE_REPOSITORY: ghcr.io/someoneunlicensed/leetcot
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    steps:
      - name: Free disk space before build
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          docker image prune -a -f || true
          docker builder prune -a -f || true
          sudo journalctl --vacuum-size=50M || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env file
        run: |
          if [ -f /home/runner/secrets.env ]; then
            cp /home/runner/secrets.env ./.env
          else
            echo "::error::Host secrets.env file not found at /home/runner/secrets.env"
            exit 1
          fi

      - name: Build app image (with BuildKit)
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          get_env() {
            grep -m1 "^$1=" ./.env | cut -d= -f2-
          }
          export SENTRY_AUTH_TOKEN="$(get_env SENTRY_AUTH_TOKEN)"
          NEXT_PUBLIC_SENTRY_DSN="$(get_env NEXT_PUBLIC_SENTRY_DSN)"
          SENTRY_ORG="$(get_env SENTRY_ORG)"
          SENTRY_PROJECT="$(get_env SENTRY_PROJECT)"

          docker build \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="$NEXT_PUBLIC_SENTRY_DSN" \
            --build-arg NEXT_PUBLIC_APP_VERSION="${GITHUB_SHA::8}" \
            --build-arg SENTRY_ORG="$SENTRY_ORG" \
            --build-arg SENTRY_PROJECT="$SENTRY_PROJECT" \
            -t "$IMAGE" \
            -t "${IMAGE_REPOSITORY}:latest" \
            .

      - name: Import image into k3s containerd
        run: |
          IMAGE="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker save "$IMAGE" "${IMAGE_REPOSITORY}:latest" -o /tmp/leetcot.tar
          sudo k3s ctr -n k8s.io images import --all-platforms /tmp/leetcot.tar
          rm -f /tmp/leetcot.tar

      - name: Restart deployment (rolling update)
        run: |
          IMAGE="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          kubectl -n production set image deploy/leetcot-app app="$IMAGE"
          kubectl -n production set image deploy/leetcot-code-runner code-runner="$IMAGE"

          if ! kubectl -n production rollout status deploy/leetcot-app --timeout=300s; then
            kubectl -n production rollout undo deploy/leetcot-app
            exit 1
          fi

          if ! kubectl -n production rollout status deploy/leetcot-code-runner --timeout=300s; then
            kubectl -n production rollout undo deploy/leetcot-code-runner
            exit 1
          fi

      - name: Apply database migrations
        run: |
          POD=$(kubectl -n production get pod -l app=leetcot-app -o jsonpath='{.items[0].metadata.name}')
          kubectl -n production exec "$POD" -- pnpm --filter @repo/db exec prisma migrate deploy

      - name: Clean up build artifacts
        if: always()
        run: |
          docker image prune -a -f || true
          docker builder prune -a -f || true
          echo "=== Disk after deploy ==="
          df -h /
