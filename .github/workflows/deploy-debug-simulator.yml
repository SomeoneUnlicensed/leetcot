name: Deploy Debug Simulator (Lenta tech)

# Отдельный пайплайн для форка «Дебаг-Симулятор» — не связан с deploy.yml
# (тот катит основной продукт leetcot.ru в общий k3s-кластер). Этот деплоит
# ветку claude/feed-platform-fork-wk0tu0 на отдельный однохостовый сервер
# мероприятия через docker-compose по SSH.
#
# Только ручной запуск: Actions → Deploy Debug Simulator (Lenta tech) → Run workflow.
#
# Нужные repo secrets (Settings → Secrets and variables → Actions):
#   DEBUG_SIMULATOR_SSH_HOST        — хост/IP сервера
#   DEBUG_SIMULATOR_SSH_USER        — SSH-пользователь
#   DEBUG_SIMULATOR_SSH_KEY         — приватный SSH-ключ (без пароля)
#   DEBUG_SIMULATOR_SSH_PORT        — порт SSH (необязательно, по умолчанию 22)
#   DEBUG_SIMULATOR_DEPLOY_PATH     — папка на сервере под деплой (создаётся
#                                      сама при первом запуске, git туда не
#                                      нужен — воркфлоу сам докладывает
#                                      docker-compose.yaml и поднимает стек)
#
# Полностью самодостаточен: первый же запуск на чистом сервере создаёт папку,
# кладёт docker-compose.yaml, генерирует .env с боевыми секретами (если его
# там ещё нет — при повторных запусках существующий .env не трогается, чтобы
# не разлогинить всех участников сменой NEXTAUTH_SECRET) и поднимает стек.
# Собирать репозиторий на сервере не нужно — образ уже собран и запушен в GHCR
# на шаге build.

on:
  workflow_dispatch:

concurrency:
  group: debug-simulator-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_REPOSITORY: ghcr.io/someoneunlicensed/leetcot
      IMAGE_TAG: debug-simulator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: claude/feed-platform-fork-wk0tu0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    env:
      IMAGE_REPOSITORY: ghcr.io/someoneunlicensed/leetcot
      IMAGE_TAG: debug-simulator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: claude/feed-platform-fork-wk0tu0

      - name: Ensure deploy folder exists on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEBUG_SIMULATOR_SSH_HOST }}
          username: ${{ secrets.DEBUG_SIMULATOR_SSH_USER }}
          key: ${{ secrets.DEBUG_SIMULATOR_SSH_KEY }}
          port: ${{ secrets.DEBUG_SIMULATOR_SSH_PORT || 22 }}
          script_stop: true
          script: mkdir -p "${{ secrets.DEBUG_SIMULATOR_DEPLOY_PATH }}/pgadmin"

      - name: Copy docker-compose.yaml + pgadmin config to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEBUG_SIMULATOR_SSH_HOST }}
          username: ${{ secrets.DEBUG_SIMULATOR_SSH_USER }}
          key: ${{ secrets.DEBUG_SIMULATOR_SSH_KEY }}
          port: ${{ secrets.DEBUG_SIMULATOR_SSH_PORT || 22 }}
          source: 'docker-compose.yaml,pgadmin/servers.json'
          target: ${{ secrets.DEBUG_SIMULATOR_DEPLOY_PATH }}
          strip_components: 0

      - name: Bootstrap .env (first run only), pull image, restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEBUG_SIMULATOR_SSH_HOST }}
          username: ${{ secrets.DEBUG_SIMULATOR_SSH_USER }}
          key: ${{ secrets.DEBUG_SIMULATOR_SSH_KEY }}
          port: ${{ secrets.DEBUG_SIMULATOR_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEBUG_SIMULATOR_DEPLOY_PATH }}"

            if [ ! -f .env ]; then
              echo "No .env found — bootstrapping fresh production secrets."
              {
                echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
                echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)"
              } > .env
              chmod 600 .env
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export LEETCOT_IMAGE="${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}"
            docker compose pull app code-runner db redis
            docker compose up -d

            docker image prune -f
            docker logout ghcr.io

            echo "Deployed ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }} (${{ github.sha }})"

      - name: Health-check the deployed app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEBUG_SIMULATOR_SSH_HOST }}
          username: ${{ secrets.DEBUG_SIMULATOR_SSH_USER }}
          key: ${{ secrets.DEBUG_SIMULATOR_SSH_KEY }}
          port: ${{ secrets.DEBUG_SIMULATOR_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEBUG_SIMULATOR_DEPLOY_PATH }}"
            # entrypoint.sh runs migrate deploy + seed + challenge-image builds on
            # every app container start, before it actually starts listening — give
            # it real time (image builds especially) rather than failing fast.
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null "http://127.0.0.1:3002/login"; then
                echo "App is up and responding on :3002/login"
                exit 0
              fi
              sleep 10
            done
            echo "App did not become healthy in time — dumping recent logs:"
            docker compose logs --tail=200 app
            exit 1
