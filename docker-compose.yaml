name: leetcot

# The app runs as two interchangeable instances, "blue" (:3002) and "green" (:3012), behind
# nginx (upstream "leetcot_app"). scripts/deploy/deploy.sh starts the idle colour with the new
# image, switches nginx over once it is healthy and retires the old colour after it drains,
# so a deploy never drops requests or open terminal sessions. Do not `docker compose up` the
# app services by hand - use the script (it also pins the per-colour image tags).
x-app-common: &app-common
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 10g
  memswap_limit: 10g
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '5'
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    # Persistent CTF flags: without this the seed regenerates every flag on each container start.
    - flags:/data/flags
  env_file:
    - .env
  environment:
    - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-dev}@db:5432/leetcot?schema=public
    - REDIS_URL=redis://redis:6379
    - NODE_ENV=${NODE_ENV:-production}
    - CODE_RUNNER_MAX_QUEUE_DEPTH=${CODE_RUNNER_MAX_QUEUE_DEPTH:-20}
    - AUTH_URL=${AUTH_URL:-https://lenta.leetcot.ru}
    - NEXTAUTH_URL=${NEXTAUTH_URL:-https://lenta.leetcot.ru}
    - DEBUG_FLAGS_FILE=/data/flags/debug-flags.json
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  healthcheck:
    # the web server listens on the container IP only, not on 127.0.0.1
    test: ['CMD-SHELL', 'wget -q -O /dev/null "http://$$(hostname -i):3000/login" || exit 1']
    interval: 10s
    timeout: 5s
    retries: 6
    # first boot may run migrations, seeding and build the task images
    start_period: 300s

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: leetcot
    volumes:
      - leetcot-data:/var/lib/postgresql/data
    # ports:
    #   - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d leetcot']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: 'bitnami/redis:latest'
    container_name: leetcot-redis
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - 127.0.0.1:6380:6379

  app-blue:
    <<: *app-common
    container_name: leetcot-app-blue
    image: ${APP_BLUE_IMAGE:-ghcr.io/someoneunlicensed/leetcot:debug-simulator}
    ports:
      - 127.0.0.1:3002:3000

  app-green:
    <<: *app-common
    container_name: leetcot-app-green
    image: ${APP_GREEN_IMAGE:-ghcr.io/someoneunlicensed/leetcot:debug-simulator}
    ports:
      - 127.0.0.1:3012:3000

  runtime-images:
    image: docker:27-cli
    restart: 'no'
    command:
      - sh
      - -c
      - |
        docker pull python:3.11-alpine
        docker pull node:20-alpine
        docker pull golang:1.24-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  code-runner:
    image: ${LEETCOT_IMAGE:-ghcr.io/someoneunlicensed/leetcot:debug-simulator}
    build:
      context: .
    restart: always
    entrypoint: ['pnpm', '--filter', 'code-runner', 'start']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-dev}@db:5432/leetcot?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=${NODE_ENV:-production}
      - CODE_RUNNER_CONCURRENCY=${CODE_RUNNER_CONCURRENCY:-2}
      - CODE_RUNNER_TIMEOUT_MS=${CODE_RUNNER_TIMEOUT_MS:-10000}
      - CODE_RUNNER_MEMORY_LIMIT=${CODE_RUNNER_MEMORY_LIMIT:-128m}
      - CODE_RUNNER_CPU_LIMIT=${CODE_RUNNER_CPU_LIMIT:-0.5}
      - CODE_RUNNER_MAX_OUTPUT_BYTES=${CODE_RUNNER_MAX_OUTPUT_BYTES:-16000}
    depends_on:
      runtime-images:
        condition: service_completed_successfully
      redis:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:8
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@leetcot.ru}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-dev}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - 127.0.0.1:5050:80
    depends_on:
      db:
        condition: service_healthy

volumes:
  leetcot-data:
    name: leetcot_leetcot-data
    driver: local
  pgadmin-data:
    name: leetcot_pgadmin-data
    driver: local
  flags:
    # created (and bootstrapped) by scripts/deploy/deploy.sh; never delete it while an event runs
    name: leetcot_flags
    external: true
